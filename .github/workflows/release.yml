name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-release:
    name: Windows release
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Read package version
        id: version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $package = Get-Content package.json | ConvertFrom-Json
          $version = $package.version
          $tag = "v$version"

          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT

          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }

          $encodedTag = [System.Uri]::EscapeDataString($tag)
          $releaseResponse = Invoke-WebRequest `
            -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/tags/$encodedTag" `
            -Headers $headers `
            -SkipHttpErrorCheck

          if ($releaseResponse.StatusCode -eq 200) {
            "release_exists=true" >> $env:GITHUB_OUTPUT
            "Release $tag already exists; skipping build and publish." >> $env:GITHUB_STEP_SUMMARY
          } elseif ($releaseResponse.StatusCode -eq 404) {
            "release_exists=false" >> $env:GITHUB_OUTPUT
            "Release $tag does not exist; building Windows installer." >> $env:GITHUB_STEP_SUMMARY
          } else {
            throw "Failed to check release $tag. GitHub API returned HTTP $($releaseResponse.StatusCode): $($releaseResponse.Content)"
          }

      - name: Set up Bun
        if: steps.version.outputs.release_exists != 'true'
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        if: steps.version.outputs.release_exists != 'true'
        run: bun install --frozen-lockfile

      - name: Run checks
        if: steps.version.outputs.release_exists != 'true'
        run: bun run check

      - name: Run unit tests
        if: steps.version.outputs.release_exists != 'true'
        run: bun run test:unit

      - name: Build Windows installer
        if: steps.version.outputs.release_exists != 'true'
        run: bun run dist:win -- --publish never

      - name: Upload workflow artifact
        if: steps.version.outputs.release_exists != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: path-profile-windows-${{ steps.version.outputs.version }}
          path: dist/Path-Profile*-win-x64.*
          if-no-files-found: error

      - name: Create GitHub release
        if: steps.version.outputs.release_exists != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ steps.version.outputs.tag }}"
          $version = "${{ steps.version.outputs.version }}"
          $artifacts = Get-ChildItem dist -File |
            Where-Object { $_.Name -like "Path-Profile*-win-x64.*" } |
            ForEach-Object { $_.FullName }

          if (-not $artifacts) {
            throw "No release artifacts were found in dist/."
          }

          gh release create $tag @artifacts `
            --repo $env:GITHUB_REPOSITORY `
            --title "Path Profile $version" `
            --generate-notes
